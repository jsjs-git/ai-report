# ═══════════════════════════════════════════════════════════════
#  디자인 테마: dark (블랙 베이스)
#
#  ★ 디자인 값(색·글꼴·크기·여백)은 이 파일에만 있어요.
#    웹 리포트와 이메일 모두 여기서 값을 가져가요.
#  ★ 새 디자인을 만들려면: 이 파일을 복사 → themes/<이름>.yaml 로 저장 →
#    값만 바꾸고 → 주제 설정 파일에서 theme: <이름> 으로 바꾸면 끝.
#  ★ 색상은 "#RRGGBB" 형식(6자리)으로 써 주세요. (이메일 호환)
# ═══════════════════════════════════════════════════════════════
name: dark

colors:
  bg: "#0B0B0D"            # 페이지 배경 (거의 검정)
  surface: "#16171B"       # 카드 배경
  surface_alt: "#1E2026"   # 카드 안 강조 상자 (3줄 요약 등)
  border: "#2A2D35"        # 테두리·구분선
  text: "#E8E8EC"          # 본문 글자 (순백보다 부드러운 흰색)
  text_muted: "#A2A5AD"    # 보조 글자 (설명·날짜)
  text_faint: "#858A94"    # 가장 옅은 글자 (출처 표기 등)
  accent: "#5CC8FF"        # 강조색 (제목 표시·버튼)
  accent_text: "#06141C"   # 강조색 버튼 위 글자색
  link: "#7DD3FC"          # 링크
  tag_default: "#9AA3B2"   # 색이 지정되지 않은 묶음 태그
  importance_high: "#FF7A7A"   # 중요도 상
  importance_mid: "#FFC857"    # 중요도 중
  importance_low: "#8B93A1"    # 중요도 하
  tier_new: "#7CE0B0"          # 논문: 신규 주목
  tier_proven: "#C9A7FF"       # 논문: 검증된 논문

# 묶음(group) 이름별 태그 색 — 설정 파일의 group 값과 똑같이 적어요
group_colors:
  Anthropic: "#E08A6D"
  OpenAI: "#3FC79A"
  Google: "#6EA8FE"
  Meta: "#5B9BFF"
  xAI: "#D0D4DC"
  Mistral: "#FF9F43"
  Qwen: "#A78BFA"
  DeepSeek: "#4FA3FF"
  논문: "#C9A7FF"

fonts:
  # 웹에서만 불러오는 한글 글꼴 (이메일은 기기 기본 글꼴로 자동 대체)
  web_import: "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
  body: "Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif"

sizes:
  base: "16px"         # 본문
  small: "14px"        # 보조 글
  tiny: "12px"         # 태그·출처
  title: "28px"        # 리포트 제목(날짜)
  section: "20px"      # 칸 제목
  item: "18px"         # 항목 제목
  line_height: "1.7"   # 줄 간격 (가독성 핵심)

layout:
  max_width: "720px"       # 본문 최대 폭
  page_padding: "24px"     # 화면 가장자리 여백
  card_padding: "24px"     # 카드 안쪽 여백
  gap: "16px"              # 카드 사이 간격
  radius: "14px"           # 카드 모서리 둥글기
  radius_small: "8px"      # 작은 상자·버튼 모서리
  mobile_breakpoint: "600px"   # 이 폭보다 좁으면 휴대폰 배치
  mobile_padding: "16px"       # 휴대폰에서 여백
